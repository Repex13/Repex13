@keyframes fl{0%,62%,100%{opacity:.9}64%,70%{opacity:.15}72%{opacity:.9}}
.glow{animation:gl 6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.75}50%{opacity:1}}
.sh{animation:sh 4s ease-in-out infinite alternate}.sh2{animation-delay:-2s}
