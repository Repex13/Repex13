name: profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Kept apart so the token secret is only ever loaded alongside GitHub's own actions.
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Top languages (all repos, incl. private and forks)
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 .github/scripts/top_languages.py langs

      - uses: actions/upload-artifact@v7
        with:
          name: top-languages
          path: langs/top-languages.svg
          retention-days: 1

  generate:
    needs: languages
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Runs before snk so dist/ is owned by the runner, not by snk's container.
      - name: Discord badge strips
        run: python3 .github/scripts/discord_badges.py dist

      - name: Keep the last languages card if the languages job failed
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/top-languages.svg" -o dist/top-languages.svg || true

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: top-languages
          path: dist

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#000000&color_dots=#ebedf0,#c6c6c6,#8f8f8f,#575757,#1f1f1f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#3a3a3a,#6b6b6b,#a8a8a8,#e6e6e6

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
