name: profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Runs before snk so dist/ is owned by the runner, not by snk's container.
      - name: Discord badge strips
        run: python3 .github/scripts/discord_badges.py dist

      - name: Keep the last trophy card if the generator fails
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/output/trophy.svg" -o dist/trophy.svg || true

      # Trophies from the project's own generator; their public server is switched off.
      - name: Trophies
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: aura

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8839ef&color_dots=#ebedf0,#ccd0da,#9ca0b0,#7287fd,#8839ef
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#cba6f7&color_dots=#161b22,#45475a,#7f849c,#b4befe,#cba6f7

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
